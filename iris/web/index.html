<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05050a" />
    <title>Íris</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%237c6cff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%2364d2ff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- A tela inicial é só isto: o orbe. Todo o resto aparece quando é preciso. -->
    <canvas id="orbe" aria-hidden="true"></canvas>

    <main class="palco">
      <!-- Legenda: a fala dela, grande e centrada, como legenda de filme. -->
      <div id="legenda" class="legenda" role="status" aria-live="polite"></div>

      <!-- O que ela está fazendo agora (ferramenta em execução). -->
      <div id="atividade" class="atividade" aria-live="polite"></div>
    </main>

    <!-- Barra inferior: só aparece no hover ou ao digitar. -->
    <footer class="barra">
      <button id="btn-microfone" class="botao" title="Falar (barra de espaço)" aria-label="Falar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"
            fill="currentColor"
          />
          <path
            d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11Z"
            fill="currentColor"
          />
        </svg>
      </button>

      <form id="form" class="campo">
        <input
          id="entrada"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Escreva ou aperte a barra de espaço para falar"
          aria-label="Mensagem"
        />
      </form>

      <button id="btn-parar" class="botao oculto" title="Interromper (Esc)" aria-label="Interromper">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" />
        </svg>
      </button>

      <button id="btn-transcricao" class="botao" title="Conversa (T)" aria-label="Ver a conversa">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path
            d="M4 5h16v11H8l-4 4V5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </footer>

    <!-- Painel da conversa, escondido por padrão. -->
    <aside id="transcricao" class="transcricao" hidden>
      <header>
        <span>Conversa</span>
        <button id="btn-fechar-transcricao" class="botao-texto" aria-label="Fechar">fechar</button>
      </header>
      <div id="mensagens" class="mensagens"></div>
    </aside>

    <!-- Pedido de autorização. Bloqueia até você decidir. -->
    <div id="permissao" class="permissao" hidden role="dialog" aria-modal="true" aria-labelledby="perm-titulo">
      <div class="cartao">
        <span id="perm-risco" class="risco"></span>
        <h2 id="perm-titulo"></h2>
        <p id="perm-explica" class="explica"></p>
        <dl class="detalhes">
          <div><dt>capacidade</dt><dd id="perm-cap"></dd></div>
          <div><dt>alvo</dt><dd id="perm-escopo"></dd></div>
        </dl>
        <p id="perm-motivo" class="motivo"></p>
        <div class="acoes">
          <button data-decisao="uma_vez" class="acao">Agora</button>
          <button data-decisao="sempre" class="acao destaque">Sempre aqui</button>
          <button data-decisao="categoria" class="acao">Sempre, para tudo</button>
          <button data-decisao="negado" class="acao recusa">Não</button>
          <button data-decisao="negado_sempre" class="acao recusa sutil">Nunca</button>
        </div>
        <p class="rodape-cartao">
          Escolhendo <strong>sempre</strong>, eu não pergunto de novo neste escopo.
          <span id="perm-prazo"></span>
        </p>
      </div>
    </div>

    <!-- Avisos: lembretes, audiências, movimentações. -->
    <div id="avisos" class="avisos" aria-live="polite"></div>

    <!-- Indicador do observador. Visível sempre que estiver ligado. -->
    <div id="observador" class="observador" hidden>
      <span class="ponto"></span> observando
    </div>

    <div id="conexao" class="conexao" hidden>reconectando…</div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
